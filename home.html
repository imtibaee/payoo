<!DOCTYPE html>
<html lang="en" data-theme="light">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home </title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <!-- tailwind  + daisyui -->
   <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    *{
        font-family: 'Outfit', sans-serif;
    }
</style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-50">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center" >
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                    <img src="assets/logo.png">
                </div>
                <div class="balannce-info">
                    <h2 class="text-2xl font-bold">$ <span id="balance">37500</span> </h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>

            </div>
            <div class="right">
                    <div id="logout-btn" class="btn btn-primary btn-active btn-warning"><i class="fa-solid fa-right-from-bracket" style="color: rgb(75, 70, 91);"></i>Log Out</div>
            
            </div>

        </section>
    </header>
    <section class="w-11/12 mx-auto">
        <div class="pt-8">
            <h1 class="font-bold text-[24px] font-[#080808]">Welcome to Pay<span class="text-primary">oo</span></h1>
            <p class="text-[16px] text-neutral/50 my-5">Enjoy easy and convenient financial services with us. Cashout charge is low and  </p>
            <div class="buttons grid grid-cols-3 gap-3">
                <button onclick="showOnly('addmoney')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft">
                    <img src="assets/opt-1.png" alt="">
                    <p>Add Money</p>
                </button>
                 <button onclick="showOnly('cashout')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft">
                    <img src="assets/opt-2.png" alt="">
                    <p>Cashout</p>
                </button>
                 <button onclick="showOnly('sendmoney')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft">
                    <img src="assets/opt-3.png" alt="">
                    <p>Send Money</p>
                </button>
                 <button onclick="showOnly('getbonus')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft   ">
                    <img src="assets/opt-4.png" alt="">
                    <p>Get Bonus</p>
                </button>
                 <button onclick="showOnly('paybills')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft">
                    <img src="assets/opt-5.png" alt="">
                    <p>Pay Bills</p>
                </button>
                 <button onclick="showOnly('transaction')" class="btn flex-col h-full py-4 rounded-xl border-grey-300 border-2 btn-primary btn-soft">
                    <img src="assets/opt-6.png" alt="">
                    <p>Transaction</p>
                </button>
            </div>
        </div>
    </section>
    <section id="addmoney"  class="w-11/12 mx-auto py-5 hidden">
        
   <h2 class="font-bold text-xl">Add Money</h2>
   <div class="form pt-5">
         <div class="card bg-base-100 w-full  shadow-sm rounded-[24px]">
      <div class="card-body ">
        <fieldset class="fieldset">
             <label class="label text-neutral/70 font-bold text-[16px]">Select A Bank</label>
            <select id="add-money-bank" class="select rounded-full bg-base-200 w-full">
       <option disabled selected>Select Bank</option>
       <option value="IBBL">ISLAMI BANK</option>
       <option value="AB Bank">AB BANK</option>
       <option value="UCB">UCB BANK</option>
       <option value="AL ARAFAH ISLAMI BANK">AL ARAFAH ISLAMI BANK</option>
       <option value="DHAKA BANK">DHAKA BANK</option>
       <option value="DUTCH BANGLA BANK">DUTCH BANGLA BANK</option>
       </select>   
       <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Bank Account Number</label>
          <input id="add-money-account" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit account number" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Amount to Add</label>
          <input id="add-money-amount" type="number" class="input rounded-full bg-base-200 w-full" placeholder="Enter Amount to Add" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Pin Number</label>
          <input id="add-money-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full text-[16px]">Add Money</button>
        </fieldset>
      </div>
    </div>
    </div>
    </section>
    <section id="cashout"  class="w-11/12 mx-auto py-5 hidden">
   <h2 class="font-bold text-xl">Cashout</h2>
   <div class="form pt-5">
         <div class="card bg-base-100 w-full  shadow-sm rounded-[24px]">
      <div class="card-body ">
        <fieldset class="fieldset">
          <label class="label text-neutral/70 font-bold text-[16px]">Agent Number</label>
          <input id="cashout-agent" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit number" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Amount</label>
          <input id="cashout-amount" type="number" class="input rounded-full bg-base-200 w-full" placeholder="Enter amount to withdraw" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Pin Number</label>
          <input id="cashout-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full text-[16px]">Withdraw Money</button>
        </fieldset>
      </div>
    </div>
    </div>
    </section>
    <section  id="sendmoney"  class="w-11/12 mx-auto py-5 hidden">
      <h1 class="font-bold text-xl">Send Money</h1>
       <div class="form pt-5">
         <div class="card bg-base-100 w-full  shadow-sm rounded-[24px]">
      <div class="card-body ">
        <fieldset class="fieldset">
          <label class="label text-neutral/70 font-bold text-[16px]">User Account Number</label>
          <input id="sendmoney-number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit number" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Amount</label>
          <input id="sendmoney-amount" type="number" class="input rounded-full bg-base-200 w-full" placeholder="Enter amount to transfer" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Pin Number</label>
          <input id="sendmoney-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="sendmoney-btn" class="btn btn-primary mt-4 rounded-full text-[16px]">Send Now</button>
        </fieldset>
      </div>
    </div>
    </div>
    </section>
    <section  id="getbonus"  class="w-11/12 mx-auto py-5 hidden">
      <h1 class="font-bold text-xl">Get Bonus</h1>
      <div class="form pt-5">
         <div class="card bg-base-100 w-full  shadow-sm rounded-[24px]">
      <div class="card-body ">
        <fieldset class="fieldset">
          <label class="label text-neutral/70 font-bold text-[16px]">Enter Bonus Coupon</label>
          <input id="coupon" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter your coupon" />
          <button id="coupon-btn" class="btn btn-primary mt-6 rounded-full text-[16px]">Get Bonus</button>
          </fieldset>
          </div>
         </div>
      </div>
    </section>
    <section  id="paybills"  class="w-11/12 mx-auto py-5 hidden">
      <h1 class="font-bold text-xl">Pay Bills</h1>
       <div class="form pt-5">
         <div class="card bg-base-100 w-full  shadow-sm rounded-[24px]">
      <div class="card-body ">
        <fieldset class="fieldset">
             <label class="label text-neutral/70 font-bold text-[16px]">Select To Pay</label>
            <select id="paybill-bank" class="select rounded-full bg-base-200 w-full">
       <option disabled selected>Select Bank</option>
       <option value="IBBL">ISLAMI BANK</option>
       <option value="AB Bank">AB BANK</option>
       <option value="UCB">UCB BANK</option>
       <option value="AL ARAFAH ISLAMI BANK">AL ARAFAH ISLAMI BANK</option>
       <option value="DHAKA BANK">DHAKA BANK</option>
       <option value="DUTCH BANGLA BANK">DUTCH BANGLA BANK</option>
       </select>   
       <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Biller Account Number</label>
          <input id="paybill-account" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200 w-full" placeholder="Enter 11 digit account number" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Amount to Pay</label>
          <input id="paybill-amount" type="number" class="input rounded-full bg-base-200 w-full" placeholder="Add Amount to pay" />
          <br>
          <label class="label text-neutral/70 font-bold text-[16px]">Pin Number</label>
          <input id="paybill-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 w-full" placeholder="Enter 4 Digit Pin" />
          <br>
          <button id="paybill-btn" class="btn btn-primary mt-4 rounded-full text-[16px]">Pay Now</button>
        </fieldset>
      </div>
    </div>
    </div>
    </section>
    <section  id="transaction"  class="w-11/12 mx-auto py-5 hidden">
      <h1 class="font-bold text-xl">Transaction History</h1>
      <h2 class="text-red-500 text-[16px]">Transaction History is not updated yet.Sorry for the inconvinient</h2>
    </section>
    <script src="js/machine.js"></script> 
    <script src="js/addmoney.js"></script> 
    <script src="js/cashout.js"></script>   
    <script src="js/sendmoney.js"></script>   
    <script src="js/bonus.js"></script>   
    <script src="js/paybills.js"></script>   

      
      
    
   
    
</body>
</html>
